name: Deploy Cloudflare Worker (staging)

# ── Scope ────────────────────────────────────────────────────────────────────────────────
#
# Staging only, on purpose. A production Worker deploy is not a pipeline step: it is step 17
# of docs/cloudflare-migration/CUTOVER-RUNBOOK.md, run by an operator inside a maintenance
# window, after the Mongo → D1 migration has been verified. Automating it before the cutover
# has been rehearsed would make "merge" and "cut over" the same button.
#
# Requires the `staging` GitHub environment to hold:
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, D1:Edit, Queues:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID
# The Worker's own secrets (AUTH_SECRET, CF_ACCESS_*, GOOGLE_*, …) live in Cloudflare
# (`wrangler secret put --env staging`), never here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy to staging
        required: false
        default: main
      apply_migrations:
        description: Apply pending D1 migrations to the staging database first
        type: boolean
        default: true

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify the required secrets exist
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing environment secrets:$missing"
            exit 1
          fi

      - name: Refuse placeholder database ids
        # The all-zero id is a placeholder in wrangler.jsonc until the real database exists.
        run: |
          if node -e "
            const s = require('fs').readFileSync('wrangler.jsonc', 'utf8');
            const start = s.indexOf('\"staging\": {');
            const staging = s.slice(start, s.indexOf('\"production\": {', start));
            process.exit(staging.includes('00000000-0000-0000-0000-000000000000') ? 0 : 1);
          "; then
            echo "::error::env.staging still has the placeholder D1 database_id. See docs/cloudflare-migration/EXTERNAL-SETUP.md."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Refuse to deploy without the Worker's secrets
        # A dashboard *variable* is deleted by the deploy below; only real secrets survive it.
        run: npm run cf:check-secrets:staging

      - name: Apply D1 migrations (staging)
        if: ${{ inputs.apply_migrations }}
        run: npm run db:migrate:staging

      - name: Build
        env:
          NODE_ENV: production
        run: npm run cf:build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy --env staging
