name: Deploy (legacy Node + MongoDB)

# ── What this deploys ────────────────────────────────────────────────────────────────────
#
# The CURRENT production stack: the Docker/SSH Node deployment on MongoDB and local storage.
# It stays the production path until the Cloudflare cutover (docs/cloudflare-migration/
# CUTOVER-RUNBOOK.md), and after it the rollback target (ROLLBACK-RUNBOOK.md). It is NOT the
# Cloudflare deployment path. That one is `deploy-cloudflare.yml` for staging, and a manual,
# runbook-driven step for production.
#
# Manual, with the environment named explicitly. Deploying research infrastructure is a
# decision somebody makes, not a side effect of merging — and staging and production
# hold different databases and different storage volumes, so choosing one is the point.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: main

concurrency:
  # Never two deploys to the same environment at once: the second would restart
  # containers the first is still bringing up.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment protection rules (required reviewers for production) are configured in
    # the repository settings; this is what binds them to this job.
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Verify the required secrets exist
        # Fail before touching the server rather than half way through a deploy.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PATH_ON_HOST: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$PATH_ON_HOST" ] && missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not StrictHostKeyChecking=no: accepting any key would make
          # this pipeline trivially man-in-the-middleable, and it holds a deploy key.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" bash -euo pipefail <<REMOTE
            cd "$TARGET"

            echo "── Fetching $REF"
            git fetch --all --tags --prune
            git checkout --detach "$REF"

            echo "── Building images"
            GIT_SHA="$SHA" docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.production build

            echo "── Applying database indexes before the new code serves traffic"
            # A new index that the new code assumes must exist before that code runs;
            # building it afterwards means a window of collection scans.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.production run --rm scheduler \
              npx tsx scripts/check-env.ts

            echo "── Starting"
            GIT_SHA="$SHA" docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.production up -d --remove-orphans

            echo "── Waiting for readiness"
            for attempt in \$(seq 1 30); do
              if docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                   exec -T app curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null 2>&1; then
                echo "Ready after \${attempt} attempt(s)"
                exit 0
              fi
              sleep 5
            done

            echo "::error::The application did not become ready. Not rolling back automatically —"
            echo "a half-rolled-back file volume is worse than a stopped deploy. See the runbook."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=100 app
            exit 1
          REMOTE

      - name: Verify storage integrity after the deploy
        # The acceptance criterion this whole architecture exists for: files survive a
        # redeployment. This proves it every single time rather than assuming it.
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" bash -euo pipefail <<REMOTE
            cd "$TARGET"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.production run --rm scheduler npm run verify:storage
          REMOTE
