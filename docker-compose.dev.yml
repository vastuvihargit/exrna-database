# Development override: hot reload, source bind-mount, exposed ports for tooling.
# Never use this file on a server.

services:
  mongodb:
    ports:
      # Exposed so MongoDB Compass / mongosh can connect from the host.
      - '127.0.0.1:27017:27017'

  app:
    build:
      target: builder
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/biotech_drive_dev?replicaSet=rs0
      MONGODB_DATABASE: biotech_drive_dev
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      # Keep container-installed node_modules and build output out of the bind mount.
      - /app/node_modules
      - /app/.next
      - app-data:/data
    ports:
      - '3000:3000'

  nginx:
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
