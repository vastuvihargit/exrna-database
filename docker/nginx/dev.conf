# Development reverse proxy (http://localhost:8080).
# Mirrors the production proxy behaviour so upload/streaming bugs surface locally.

upstream app_upstream {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Must be >= MAX_UPLOAD_SIZE_MB, or large uploads fail at the proxy.
    client_max_body_size 2g;
    client_body_timeout 3600s;

    # Stream request bodies straight to the app instead of spooling them to nginx's
    # disk first — this is what keeps a 2 GB upload off the proxy's filesystem.
    proxy_request_buffering off;
    # Stream responses too, so downloads and Range requests start immediately.
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # There is deliberately NO location block serving /data or /uploads.
    # Files are reachable only through authenticated API routes.
}
