# Production reverse proxy: TLS termination, rate limiting, streaming uploads.
# Certificates are mounted read-only at /etc/nginx/certs (certbot on the host).

upstream app_upstream {
    server app:3000;
    keepalive 32;
}

# Rate-limit zones. The login zone is deliberately far stricter than the API zone.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=120r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;
    # ACME challenges stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    client_max_body_size 2g;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    limit_conn perip 20;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;
    # Never compress file downloads: they are already compressed or huge, and
    # gzip on a streamed response defeats Range requests.
    gzip_proxied off;

    location /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /_next/static/ {
        proxy_pass http://app_upstream;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # No location serves the storage volume. Physical paths are not routable.
    location ~ ^/(data|uploads|storage)/ { return 404; }
}
